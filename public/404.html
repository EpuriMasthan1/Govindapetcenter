<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Govinda Pet Center</title>
    <script>
      // GitHub Pages SPA fallback: redirect deep links back to the app
      var pathSegmentsToKeep = 1; // /govinda-pet-center/
      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);
      var redirect = segments.slice(0, pathSegmentsToKeep).join('/');
      var query = l.search;
      var hash = l.hash;
      window.location.href = l.protocol + '//' + l.host + '/' + redirect + '/?redirect=' + encodeURIComponent(segments.slice(pathSegmentsToKeep).join('/') + query + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to Govinda Pet Center...</p>
  </body>
</html>
